TYPO3:
  CMS:
    Form:
      prototypes:
        standard:
          formEditor:
            dynamicJavaScriptModules:
              additionalViewModelModules:
                - '@haffner/jh-captcha/Backend/FormEditor/JhCaptchaRecaptchaViewModel.js'

            formEditorPartials:
              FormElement-JhCaptchaRecaptcha: 'Stage/SimpleTemplate'

          formElementsDefinition:
            JhCaptchaRecaptcha:
              formEditor:
                label: 'formEditor.elements.JhCaptchaRecaptcha.label'
                group: custom
                groupSorting: 1000
                iconIdentifier: 't3-form-icon-jhcaptcha-recaptcha'
                predefinedDefaults:
                  validators:
                    -
                      identifier: 'NotEmpty'
                    -
                      identifier: 'JhCaptchaRecaptcha'
